services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: garasi
      MYSQL_PASSWORD: garasi123
      MYSQL_DATABASE: garasi_java_mobilindo
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      MYSQL_HOST: db
      MYSQL_USER: garasi
      MYSQL_PASSWORD: garasi123
      MYSQL_DATABASE: garasi_java_mobilindo
      MYSQL_PORT: 3306
      SESSION_SECRET: garasi-java-mobilindo-secret-ubah-ini
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./public:/app/public:ro
      - ./server:/app/server
      - /app/server/node_modules

volumes:
  dbdata:
